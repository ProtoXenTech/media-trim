<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1544" height="500" fill="url(#bg)" />

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="220" cy="120" r="190" fill="#059669" opacity="0.22" filter="url(#glow)" />
  <circle cx="1320" cy="360" r="210" fill="#10b981" opacity="0.18" filter="url(#glow)" />

  <!-- Shield + Photo Landscape Graphic (Left Hero Asset) -->
  <g transform="translate(140, 75)">
    <!-- Shield Base -->
    <path d="M175 25 L290 70 V185 C290 275 175 345 175 345 C175 345 60 275 60 185 V70 Z" 
          fill="url(#accent)" 
          stroke="rgba(255, 255, 255, 0.2)" 
          stroke-width="5" />

    <!-- Photo Landscape Frame -->
    <rect x="115" y="105" width="120" height="90" rx="10" fill="#ffffff" />
    <circle cx="145" cy="132" r="11" fill="#fbbf24" />
    <polygon points="115,195 150,152 180,182 200,162 235,195" fill="#10b981" />

    <!-- Sparkle Badge -->
    <circle cx="245" cy="100" r="20" fill="#10b981" stroke="#ffffff" stroke-width="3" />
    <path d="M238 100 L243 105 L252 95" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography & Copy (Right) -->
  <g transform="translate(540, 150)">
    <!-- Badge -->
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#065f46" opacity="0.6" />
    <text x="100" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1">SAFETY-FIRST MEDIA</text>

    <!-- Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1">Media Trim</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="400" fill="#94a3b8">
      Unused Media Detection • Safe Quarantine • Reclaim Hosting Storage
    </text>

    <!-- Bullet Specs -->
    <g transform="translate(0, 205)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="38" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="90" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#34d399" text-anchor="middle">🛡️ 1-Click Restore</text>

      <!-- Pill 2 -->
      <rect x="195" y="0" width="205" height="38" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="297" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#34d399" text-anchor="middle">🔍 0 False-Positives</text>

      <!-- Pill 3 -->
      <rect x="415" y="0" width="190" height="38" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="510" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#34d399" text-anchor="middle">⚡ Chunked Batches</text>
    </g>
  </g>
</svg>
